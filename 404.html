<body>
<div>
  <h1>Страница не найдена</h1>
  <p><a href="./">На главную</a> · <a href="https://osteopathlesnov.ru">osteopathlesnov.ru</a></p>
</div>
<script>
  // Страницы Tilda без .html (например /osteopatiya) - перевести на файл копии
  (function () {
    var m = location.pathname.match(/^(.*\/)([a-z0-9\-]+)\/?$/);
    var known = ['osteopatiya', 'iscelenie', 'distancionnayasessiya', 'perezagruzka', 'denezhnyy-potok', 'pererozhdenie'];
    if (m && known.indexOf(m[2]) !== -1) location.replace(m[1] + m[2] + '.html' + location.hash);
  })();
</script>
